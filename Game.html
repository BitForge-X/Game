<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAN Emoji Hunters</title>

<style>
    body{
        margin:0;
        background:#111;
        overflow:hidden;
        font-family:Arial, sans-serif;
        color:white;
    }

    #topBar{
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:60px;
        background:#1a1a1a;
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:0 20px;
        box-sizing:border-box;
        z-index:10;
        border-bottom:2px solid #333;
    }

    #leaderboard{
        position:absolute;
        right:10px;
        top:70px;
        width:220px;
        background:rgba(0,0,0,0.7);
        padding:10px;
        border-radius:10px;
        z-index:10;
    }

    #gameCanvas{
        background:#181818;
        display:block;
    }

    #menu{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%, -50%);
        background:#222;
        padding:20px;
        border-radius:15px;
        z-index:20;
        width:350px;
    }

    input, button, select{
        width:100%;
        margin-top:10px;
        padding:10px;
        border:none;
        border-radius:8px;
        box-sizing:border-box;
    }

    button{
        background:#00b894;
        color:white;
        font-weight:bold;
        cursor:pointer;
    }

    button:hover{
        background:#00d1a0;
    }

    #connectionArea{
        margin-top:15px;
    }

    textarea{
        width:100%;
        height:100px;
        margin-top:10px;
        background:#111;
        color:#0f0;
        border:none;
        padding:10px;
        box-sizing:border-box;
        border-radius:10px;
    }

    .emojiSelect{
        display:flex;
        gap:10px;
        flex-wrap:wrap;
        margin-top:10px;
    }

    .emoji{
        font-size:30px;
        cursor:pointer;
        border:2px solid transparent;
        padding:5px;
        border-radius:10px;
    }

    .selected{
        border:2px solid cyan;
    }
</style>
</head>

<body>

<div id="topBar">
    <div>⏱️ Time: <span id="timer">120</span></div>
    <div>🎮 LAN Emoji Hunters</div>
    <div>🏆 Score: <span id="score">0</span></div>
</div>

<div id="leaderboard">
    <h3>Leaderboard</h3>
    <div id="playersList"></div>
</div>

<div id="menu">
    <h2>Join Game</h2>

    <input type="text" id="playerName" placeholder="Enter Name">

    <div class="emojiSelect" id="emojiContainer"></div>

    <button onclick="startHost()">Create Host</button>
    <button onclick="joinHost()">Join Host</button>

    <div id="connectionArea"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const emojis = ["😎","🤖","👻","🔥","🚀","🐱","💀","🦖"];
let selectedEmoji = "😎";

const emojiContainer = document.getElementById("emojiContainer");

emojis.forEach(e=>{
    const div = document.createElement("div");
    div.innerHTML = e;
    div.className = "emoji";
    if(e === selectedEmoji) div.classList.add("selected");

    div.onclick = ()=>{
        document.querySelectorAll(".emoji").forEach(x=>x.classList.remove("selected"));
        div.classList.add("selected");
        selectedEmoji = e;
    }

    emojiContainer.appendChild(div);
});

let player = {
    id:Math.random().toString(36).substring(2),
    x:200,
    y:200,
    score:0,
    emoji:selectedEmoji,
    name:"",
    speed:5
};

let players = {};
players[player.id] = player;

let pickups = [];
let timer = 120;

const pickupTypes = [
    {emoji:"💎", points:10},
    {emoji:"🔥", points:20},
    {emoji:"⚡", points:15},
    {emoji:"💀", points:-5},
];

function spawnPickup(){
    pickups.push({
        x:Math.random()*(canvas.width-100)+50,
        y:Math.random()*(canvas.height-100)+50,
        type:pickupTypes[Math.floor(Math.random()*pickupTypes.length)]
    });
}

setInterval(spawnPickup, 2000);

for(let i=0;i<5;i++) spawnPickup();

let keys = {};

window.addEventListener("keydown", e=>keys[e.key]=true);
window.addEventListener("keyup", e=>keys[e.key]=false);

function update(){

    if(keys["w"] || keys["ArrowUp"]) player.y -= player.speed;
    if(keys["s"] || keys["ArrowDown"]) player.y += player.speed;
    if(keys["a"] || keys["ArrowLeft"]) player.x -= player.speed;
    if(keys["d"] || keys["ArrowRight"]) player.x += player.speed;

    pickups.forEach((p,index)=>{
        let dx = player.x - p.x;
        let dy = player.y - p.y;
        let dist = Math.sqrt(dx*dx+dy*dy);

        if(dist < 40){
            player.score += p.type.points;
            pickups.splice(index,1);
            document.getElementById("score").innerText = player.score;
        }
    });

    players[player.id] = player;

    broadcastGameState();
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    pickups.forEach(p=>{
        ctx.font = "40px Arial";
        ctx.fillText(p.type.emoji,p.x,p.y);
    });

    Object.values(players).forEach(pl=>{

        ctx.font = "50px Arial";
        ctx.fillText(pl.emoji, pl.x, pl.y);

        ctx.fillStyle = "white";
        ctx.font = "18px Arial";
        ctx.fillText(pl.name, pl.x-10, pl.y+30);

    });

}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();

setInterval(()=>{
    timer--;
    document.getElementById("timer").innerText = timer;

    if(timer <= 0){
        alert("Game Over!");
        location.reload();
    }

},1000);

function updateLeaderboard(){

    let html = "";

    Object.values(players)
        .sort((a,b)=>b.score-a.score)
        .forEach(p=>{
            html += `<div>${p.emoji} ${p.name} - ${p.score}</div>`;
        });

    document.getElementById("playersList").innerHTML = html;
}

setInterval(updateLeaderboard,500);



// ==========================
// WEBRTC SECTION
// ==========================

let peerConnections = {};
let dataChannels = {};
let isHost = false;

function startHost(){

    player.name = document.getElementById("playerName").value || "Host";
    player.emoji = selectedEmoji;

    isHost = true;

    createConnectionUI();
}

function joinHost(){

    player.name = document.getElementById("playerName").value || "Player";
    player.emoji = selectedEmoji;

    createJoinUI();
}

function createConnectionUI(){

    const area = document.getElementById("connectionArea");

    area.innerHTML = `
        <button onclick="generateOffer()">Generate Host Key</button>
        <textarea id="offerBox" placeholder="Host Key"></textarea>
        <textarea id="answerBox" placeholder="Paste Client Answer"></textarea>
        <button onclick="acceptAnswer()">Connect Player</button>
    `;
}

async function generateOffer(){

    const pc = new RTCPeerConnection();

    const channel = pc.createDataChannel("game");

    setupDataChannel(channel);

    peerConnections["pending"] = pc;
    dataChannels["pending"] = channel;

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    document.getElementById("offerBox").value =
        btoa(JSON.stringify(offer));

}

async function acceptAnswer(){

    const answer =
        JSON.parse(atob(document.getElementById("answerBox").value));

    const pc = peerConnections["pending"];

    await pc.setRemoteDescription(answer);

    alert("Player Connected!");
}

function createJoinUI(){

    const area = document.getElementById("connectionArea");

    area.innerHTML = `
        <textarea id="remoteOffer" placeholder="Paste Host Key"></textarea>
        <button onclick="connectToHost()">Connect</button>
        <textarea id="clientAnswer" placeholder="Client Answer"></textarea>
    `;
}

async function connectToHost(){

    const offer =
        JSON.parse(atob(document.getElementById("remoteOffer").value));

    const pc = new RTCPeerConnection();

    pc.ondatachannel = (event)=>{
        setupDataChannel(event.channel);
    }

    await pc.setRemoteDescription(offer);

    const answer = await pc.createAnswer();

    await pc.setLocalDescription(answer);

    document.getElementById("clientAnswer").value =
        btoa(JSON.stringify(answer));

}

function setupDataChannel(channel){

    channel.onopen = ()=>{
        console.log("Connected");
    }

    channel.onmessage = (event)=>{

        const data = JSON.parse(event.data);

        if(data.type === "state"){

            players = data.players;
            pickups = data.pickups;
        }

        if(data.type === "playerUpdate"){

            players[data.player.id] = data.player;
        }

    }

}

function broadcastGameState(){

    const data = JSON.stringify({
        type:"state",
        players:players,
        pickups:pickups
    });

    Object.values(dataChannels).forEach(ch=>{
        if(ch.readyState === "open"){
            ch.send(data);
        }
    });

}

</script>

</body>
</html>
