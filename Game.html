<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAN Snake Arena</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial;
    color:white;
}

canvas{
    display:block;
    background:#181818;
}

#topbar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:#222;
    display:flex;
    justify-content:space-around;
    align-items:center;
    border-bottom:2px solid #333;
    z-index:10;
}

#leaderboard{
    position:absolute;
    right:10px;
    top:70px;
    width:220px;
    background:rgba(0,0,0,0.7);
    padding:10px;
    border-radius:10px;
    z-index:10;
}

#menu{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#222;
    padding:20px;
    border-radius:15px;
    width:350px;
    z-index:20;
}

input, textarea, button{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    background:#00b894;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00d9a5;
}

textarea{
    height:100px;
    background:#111;
    color:#00ff99;
}

.emojiContainer{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
}

.emoji{
    font-size:35px;
    cursor:pointer;
    border:2px solid transparent;
    border-radius:10px;
    padding:5px;
}

.selected{
    border:2px solid cyan;
}

</style>
</head>

<body>

<div id="topbar">
    <div>🐍 LAN Snake Arena</div>
    <div>Players: <span id="playerCount">1</span>/5</div>
</div>

<div id="leaderboard">
    <h3>Leaderboard</h3>
    <div id="scores"></div>
</div>

<div id="menu">

    <h2>Join Game</h2>

    <input type="text" id="playerName" placeholder="Enter Name">

    <input type="file" id="avatarUpload" accept="image/*">

    <div class="emojiContainer" id="emojiContainer"></div>

    <button onclick="startHost()">Create Host</button>

    <button onclick="showJoin()">Join Game</button>

    <div id="connectionArea"></div>

    <button onclick="startGame()">
        Start Match
    </button>

</div>

<canvas id="game"></canvas>

<script>

// =====================================
// CANVAS
// =====================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// =====================================
// GLOBALS
// =====================================

const GRID = 20;

let isHost = false;

let peerConnections = {};
let dataChannels = {};

const snakes = {};
const foods = [];

const emojis = ["😎","🤖","👻","🔥","🚀","🐱","💀","🦖"];

let selectedEmoji = "😎";

// =====================================
// PLAYER
// =====================================

const player = {

    id:Math.random().toString(36).substring(2),

    name:"",

    emoji:selectedEmoji,

    avatar:null,

    avatarSrc:null,

    color:randomColor(),

    score:0,

    alive:true,

    direction:"right",

    body:[
        {x:200,y:200},
        {x:180,y:200},
        {x:160,y:200}
    ]

};

snakes[player.id] = player;

// =====================================
// RANDOM COLOR
// =====================================

function randomColor(){

    return `hsl(${Math.random()*360},80%,60%)`;

}

// =====================================
// START GAME
// =====================================

function startGame(){

    document.getElementById("menu").style.display = "none";

}

// =====================================
// EMOJI SELECT
// =====================================

const emojiContainer =
    document.getElementById("emojiContainer");

emojis.forEach(e=>{

    const div = document.createElement("div");

    div.className = "emoji";

    div.innerHTML = e;

    if(e === selectedEmoji){
        div.classList.add("selected");
    }

    div.onclick = ()=>{

        document.querySelectorAll(".emoji")
            .forEach(x=>x.classList.remove("selected"));

        div.classList.add("selected");

        selectedEmoji = e;

        player.emoji = e;

    }

    emojiContainer.appendChild(div);

});

// =====================================
// AVATAR UPLOAD
// =====================================

document.getElementById("avatarUpload")
.addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        const img = new Image();

        img.src = event.target.result;

        player.avatar = img;

        player.avatarSrc = event.target.result;

    }

    reader.readAsDataURL(file);

});

// =====================================
// FOOD
// =====================================

function spawnFood(){

    foods.push({

        x:Math.floor(Math.random()*(canvas.width/GRID))*GRID,

        y:Math.floor(Math.random()*(canvas.height/GRID))*GRID,

        emoji:["🍎","🍕","☕","💎","⚡"][Math.floor(Math.random()*5)]

    });

}

for(let i=0;i<20;i++){
    spawnFood();
}

// =====================================
// CONTROLS
// =====================================

window.addEventListener("keydown", e=>{

    if(e.key === "ArrowUp" || e.key === "w"){
        player.direction = "up";
    }

    if(e.key === "ArrowDown" || e.key === "s"){
        player.direction = "down";
    }

    if(e.key === "ArrowLeft" || e.key === "a"){
        player.direction = "left";
    }

    if(e.key === "ArrowRight" || e.key === "d"){
        player.direction = "right";
    }

});

// =====================================
// GAME LOOP
// =====================================

function gameTick(){

    if(!player.alive) return;

    const head = {...player.body[0]};

    if(player.direction === "up") head.y -= GRID;
    if(player.direction === "down") head.y += GRID;
    if(player.direction === "left") head.x -= GRID;
    if(player.direction === "right") head.x += GRID;

    // wall collision

    if(
        head.x < 0 ||
        head.y < 0 ||
        head.x > canvas.width ||
        head.y > canvas.height
    ){

        die();

        return;
    }

    // self collision

    for(let part of player.body){

        if(head.x === part.x && head.y === part.y){

            die();

            return;
        }
    }

    player.body.unshift(head);

    // food collision

    let ate = false;

    foods.forEach((food,index)=>{

        if(head.x === food.x && head.y === food.y){

            player.score++;

            ate = true;

            foods.splice(index,1);

            spawnFood();

        }

    });

    if(!ate){
        player.body.pop();
    }

    snakes[player.id] = player;

    broadcastState();

}

setInterval(gameTick,100);

// =====================================
// DIE
// =====================================

function die(){

    player.alive = false;

    setTimeout(()=>{

        player.body = [
            {x:200,y:200},
            {x:180,y:200},
            {x:160,y:200}
        ];

        player.score = 0;

        player.alive = true;

    },3000);

}

// =====================================
// DRAW
// =====================================

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // foods

    foods.forEach(food=>{

        ctx.font = "25px Arial";

        ctx.fillText(food.emoji, food.x, food.y);

    });

    // snakes

    Object.values(snakes).forEach(snake=>{

        ctx.fillStyle = snake.color;

        snake.body.forEach((part,index)=>{

            ctx.fillRect(part.x, part.y, GRID, GRID);

            // head

            if(index === 0){

                if(snake.avatarSrc){

                    if(!snake.avatar){

                        const img = new Image();

                        img.src = snake.avatarSrc;

                        snake.avatar = img;

                    }

                    ctx.save();

                    ctx.beginPath();

                    ctx.arc(
                        part.x + GRID/2,
                        part.y + GRID/2,
                        15,
                        0,
                        Math.PI*2
                    );

                    ctx.clip();

                    ctx.drawImage(
                        snake.avatar,
                        part.x,
                        part.y,
                        30,
                        30
                    );

                    ctx.restore();

                }else{

                    ctx.font = "22px Arial";

                    ctx.fillText(
                        snake.emoji,
                        part.x,
                        part.y + 20
                    );

                }

            }

        });

        // player name

        ctx.fillStyle = "white";

        ctx.font = "14px Arial";

        ctx.fillText(
            snake.name,
            snake.body[0].x,
            snake.body[0].y - 10
        );

    });

    updateLeaderboard();

    requestAnimationFrame(draw);

}

draw();

// =====================================
// LEADERBOARD
// =====================================

function updateLeaderboard(){

    let html = "";

    Object.values(snakes)
        .sort((a,b)=>b.score-a.score)
        .forEach(s=>{

            html += `
                <div>
                    ${s.avatarSrc ? "🖼️" : s.emoji}
                    ${s.name}
                    - ${s.score}
                </div>
            `;

        });

    document.getElementById("scores").innerHTML = html;

    document.getElementById("playerCount")
        .innerText = Object.keys(snakes).length;

}

// =====================================
// HOST
// =====================================

function startHost(){

    isHost = true;

    player.name =
        document.getElementById("playerName").value || "Host";

    document.getElementById("connectionArea").innerHTML = `

        <button onclick="generateOffer()">
            Generate Host Key
        </button>

        <textarea id="offerBox"
            placeholder="Host Key"></textarea>

        <textarea id="answerBox"
            placeholder="Paste Client Answer"></textarea>

        <button onclick="acceptAnswer()">
            Connect Player
        </button>

    `;

}

// =====================================
// JOIN
// =====================================

function showJoin(){

    player.name =
        document.getElementById("playerName").value || "Player";

    document.getElementById("connectionArea").innerHTML = `

        <textarea id="remoteOffer"
            placeholder="Paste Host Key"></textarea>

        <button onclick="connectToHost()">
            Connect
        </button>

        <textarea id="clientAnswer"
            placeholder="Share This Back To Host"></textarea>

    `;

}

// =====================================
// GENERATE OFFER
// =====================================

async function generateOffer(){

    const pc = new RTCPeerConnection();

    const channel = pc.createDataChannel("game");

    setupDataChannel(channel);

    peerConnections["pending"] = pc;

    dataChannels["pending"] = channel;

    const offer = await pc.createOffer();

    await pc.setLocalDescription(offer);

    document.getElementById("offerBox").value =
        btoa(JSON.stringify(offer));

}

// =====================================
// ACCEPT ANSWER
// =====================================

async function acceptAnswer(){

    const answer = JSON.parse(
        atob(document.getElementById("answerBox").value)
    );

    const pc = peerConnections["pending"];

    await pc.setRemoteDescription(answer);

    alert("Player Connected");

}

// =====================================
// CONNECT TO HOST
// =====================================

async function connectToHost(){

    const offer = JSON.parse(
        atob(document.getElementById("remoteOffer").value)
    );

    const pc = new RTCPeerConnection();

    pc.ondatachannel = (event)=>{

        setupDataChannel(event.channel);

    }

    await pc.setRemoteDescription(offer);

    const answer = await pc.createAnswer();

    await pc.setLocalDescription(answer);

    document.getElementById("clientAnswer").value =
        btoa(JSON.stringify(answer));

}

// =====================================
// DATA CHANNEL
// =====================================

function setupDataChannel(channel){

    channel.onopen = ()=>{

        console.log("Connected");

    }

    channel.onmessage = (event)=>{

        const data = JSON.parse(event.data);

        if(data.type === "state"){

            Object.assign(snakes, data.snakes);

            foods.length = 0;

            data.foods.forEach(f=>foods.push(f));

        }

    }

}

// =====================================
// BROADCAST
// =====================================

function broadcastState(){

    const data = JSON.stringify({

        type:"state",

        snakes:snakes,

        foods:foods

    });

    Object.values(dataChannels).forEach(ch=>{

        if(ch.readyState === "open"){

            ch.send(data);

        }

    });

}

</script>

</body>
</html>
